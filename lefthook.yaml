pre-commit:
  piped: true
  fail_on_changes_diff: true
  jobs:
    # FORMATTING, changes files, and fails ci if it does
    - name: ruff-check
      glob: "*.py"
      run: ruff check --fix {staged_files}
      stage_fixed: true
    - name: ruff-format
      glob: "*.py"
      run: ruff format {staged_files}
      stage_fixed: true
    - name: php-cs-fixer
      glob: "*.php"
      run: php-cs-fixer --no-interaction --config=.php-cs-fixer.dist.php fix {staged_files}
      stage_fixed: true
    - name: shfmt
      glob: "*.sh"
      run: shfmt --write {staged_files}
      stage_fixed: true
    - name: tombi
      glob: "*.toml"
      run: tombi format {staged_files}
      stage_fixed: true

    # FIXES, changes files, excluded in ci
    - name: prettier
      tags: [fix]
      glob:
        - "*.css"
        - "*.html"
        - "*.js"
        - "*.json"
        - "*.less"
        - "*.md"
        - "*.scss"
        - "*.yaml"
        - "*.yml"
      run: prettier --write {staged_files}
      stage_fixed: true
    - name: general-fixes
      tags: [fix]
      run: run-fixes {staged_files}
      stage_fixed: true
    - name: format-xsl
      tags: [fix]
      glob: "*.xsl"
      run: for file in {staged_files}; do xmllint --format "$file" --output "$file"; done
      stage_fixed: true

    # CHECKS, does not alter any files
    - name: lefthook-validate
      glob: "lefthook.yaml"
      run: lefthook validate
    - name: reuse
      glob:
        - "*.py"
      run: reuse lint-file {staged_files}
    - name: pytest
      glob:
        - "*.py"
      run: coverage run -m pytest ./packages/build/test_pre_commit
    - name: pytest-coverage
      glob:
        - "*.py"
      run: coverage report --show-missing --fail-under=85
    - name: ty
      glob: "*.py"
      run: ty check {staged_files}
    - name: general-checks
      run: run-checks {staged_files}
    - name: simple-syntax
      glob:
        - "*.xml"
        - "*.xhtml"
        - "*.xsl"
      run: xmllint --noout {staged_files}
# for checks too slow to run all the time
ci-checks:
  commands:
    pytest:
      run: pytest
